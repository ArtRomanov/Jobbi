[project]
name = "jobbi-backend"
version = "0.1.0"
description = "Jobbi — job search assistant backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.14,<2",
    "aiosqlite>=0.20,<1",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "email-validator>=2.0,<3",
    "structlog>=24.0,<26",
    "sentry-sdk[fastapi]>=2.0,<3",
    "httpx>=0.27,<1",
    "groq>=0.13,<1",
    "python-telegram-bot[job-queue]>=21,<22",
    "tzdata>=2024.1",
    "beautifulsoup4>=4.12,<5",
    # Apache-2.0 from 1.8 (GPL before). Used later for page text extraction;
    # it pulls lxml, which parses Teamtailor RSS.
    "trafilatura>=1.8,<3",
    "lxml>=5.0,<7",
    # Pinned explicitly (also pulled in by PTB): v4 has a different API.
    "apscheduler>=3.10,<4",
    # CV upload (spec 011): multipart parsing + text extraction. All MIT/Apache.
    "python-multipart>=0.0.20,<0.1",
    # Calendar-versioned (YYYYMMDD); bound to releases up to end of 2026.
    "pdfminer.six>=20251107,<20270101",
    "python-docx>=1.2,<2",
    "openai>=1.60,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "respx>=0.22,<1",
    # Test-only: builds encrypted PDF fixtures for cv_upload tests.
    "pypdf>=6,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
